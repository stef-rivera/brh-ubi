<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ubi</title>
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body class="idle">
  <header>
    <p class="wordmark">ubi</p>
  </header>

  <main>
    <section class="stage">
      <img id="video" alt="Dashcam view" />
      <div class="hud">
        <div class="status" id="mode" hidden>IDLE</div>
        <div class="controls">
          <button id="start-file" type="button" disabled>Start</button>
          <button id="park" type="button" hidden disabled>Park</button>
          <button id="coach-end" type="button" hidden>End</button>
        </div>
        <p class="hint" id="hint"></p>
      </div>
    </section>

    <aside id="panel" hidden>
      <h2 id="panel-title" hidden>Parked practice</h2>
      <p id="coach-status" class="hint" role="status" hidden>Parking…</p>
      <p id="pipeline-status" class="hint" hidden></p>
      <div id="log" class="log" hidden></div>
      <form id="practice" class="practice" hidden>
        <p id="progress"></p>
        <img id="q-thumb" alt="" hidden />
        <p id="question"></p>
        <input id="answer" type="text" placeholder="Say it in English" autocomplete="off" />
        <div class="controls">
          <button type="submit">Check</button>
          <button id="spanish" type="button" class="secondary">Hear it in Spanish</button>
        </div>
        <p id="result"></p>
      </form>
    </aside>
  </main>
  <script src="/assets/app.js"></script>
</body>
</html>
